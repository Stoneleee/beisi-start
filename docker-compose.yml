services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: beisi-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3030
      - CORS_ORIGIN=http://localhost
    ports:
      - "3030:3030"
    networks:
      - beisi-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: beisi-web
    restart: unless-stopped
    ports:
      - "7788:7788"
    depends_on:
      - server
    networks:
      - beisi-network

networks:
  beisi-network:
    driver: bridge
